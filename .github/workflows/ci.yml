name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      LOCAL_DEMO_ADMIN_PASSWORD: local-seed-key-2026-strong
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run db:sqlite:reset
      - run: npm run db:status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
